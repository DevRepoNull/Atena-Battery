[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/provider-win",
    "crates/provider-linux",
    "crates/app",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Atena Battery Contributors"]
license = "MIT"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
